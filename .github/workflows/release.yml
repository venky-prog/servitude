name: Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Release app
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SERVER_HOST: ${{ vars.SERVER_HOST }}
          SERVER_USER: ${{ vars.SERVER_USER }}
          APPS_PATH: ${{ vars.APPS_PATH }}
          HIVE_TOKEN: ${{ secrets.HIVE_TOKEN }}
          HIVE_WORKSPACE: ${{ vars.HIVE_WORKSPACE }}
          HIVE_PROJECT: ${{ vars.HIVE_PROJECT }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $SERVER_HOST >> ~/.ssh/known_hosts 2>/dev/null

          echo "Getting apps with tag:subgraph..."
          apps=$(pnpm nx show projects --type=app --projects tag:subgraph)
          echo "$apps"

          if [ -z "$apps" ]; then
            exit 0
          fi

          mkdir -p releases

          echo "Token length: ${#HIVE_TOKEN}"

          ORDER="users accounts transactions"

          declare -A SERVICE_PORTS
          SERVICE_PORTS["users"]=6000
          SERVICE_PORTS["accounts"]=6001
          SERVICE_PORTS["transactions"]=6002

          for APP in $ORDER; do
            if echo "$apps" | grep -qx "$APP"; then
              echo "Releasing $APP..."

              pnpm nx run "$APP:build:production"

              SERVICE_URL="http://localhost:${SERVICE_PORTS[$APP]}/graphql"

              echo "Running schema check for $APP (url: $SERVICE_URL)..."
              pnpm hive schema:check \
                --target "$HIVE_WORKSPACE/$HIVE_PROJECT/production" \
                --service "$APP" \
                --url "$SERVICE_URL" \
                "./apps/$APP/src/schema/$APP.graphql"

              echo "Running schema publish for $APP..."
              pnpm hive schema:publish \
                --target "$HIVE_WORKSPACE/$HIVE_PROJECT/production" \
                --service "$APP" \
                --url "$SERVICE_URL" \
                "./apps/$APP/src/schema/$APP.graphql" \
                --github

              rsync -avz \
                -e "ssh -i ~/.ssh/id_rsa" \
                "./dist/apps/$APP/" \
                "$SERVER_USER@$SERVER_HOST:$APPS_PATH/$APP/"
            fi
          done