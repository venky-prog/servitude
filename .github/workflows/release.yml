name: Release

on:
  push:
    branches:
      - main

jobs:

  install-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup node and pnpm
        uses: ./.github/actions/setup-node-pnpm

  get-effected-apps:
    needs: install-dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Get effected apps
        id: get-effected-apps
        run: echo "apps=$(nx show projects --affected --type=app --base=origin/main --head=HEAD)" >> $GITHUB_OUTPUT
        shell: bash