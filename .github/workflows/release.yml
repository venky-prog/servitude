name: Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup node and pnpm
        uses: ./.github/actions/setup-node-pnpm


      - name: Release app
        run: |
          # Setup SSH key
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ vars.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          
          echo "Getting apps with tag:subgraph..."
          apps=$(pnpm nx show projects --type=app --projects tag:subgraph)
          echo "$apps"

          if [ -z "$apps" ]; then
            exit 0
          fi

          mkdir -p releases

          while IFS= read -r APP; do
            echo "Releasing $APP..."

            echo "${{vars.SERVER_HOST}} - ${{vars.SERVER_USER}} - $APP - /${{ vars.SERVER_USER }}/${{ vars.APPS_PATH }}/"

            pnpm nx run "$APP:build:production"

            rsync -avz \
              -e "ssh -i ~/.ssh/id_rsa" \
              ./dist/apps/"$APP"/ \
              ${{ vars.SERVER_USER }}@${{ vars.SERVER_HOST }}:/${{ vars.SERVER_USER }}/${{ vars.APPS_PATH }}/
          done <<< "$apps"
