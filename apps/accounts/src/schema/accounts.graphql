scalar Date

type Query {
  listAccounts(filter: ListAccountsFilter): [Account!]!
  getAccount(id: ID!): Account
}

type Mutation {
  createSavingsAccount(
    name: String!
    interestRate: Float!
    balance: Float!
    lastFourDigits: String!
  ): Account!

  createCreditCardAccount(
    name: String!
    lastFourDigits: String!
    limit: Float!
    billDate: Int!
  ): Account!

  createLoanAccount(
    name: String!
    lastFourDigits: String!
    date: Date!
    emiStartDate: Date!
    totalEMIs: Int!
  ): Account!
}

enum AccountType {
  SAVINGS
  CREDIT_CARD
  LOAN
}

input ListAccountsFilter {
  limit: Int
  offset: Int
}

type Account @key(fields: "_id") {
  _id: ID!
  name: String!
  accountType: AccountType!
  userId: ID!
  user: User
  lastFourDigits: String!
}

type SavingsAccount  {
  _id: ID!
  name: String!
  accountType: AccountType!
  interestRate: Float!
  balance: Float!
}

type CreditCardAccount  {
  _id: ID!
  name: String!
  accountType: AccountType!
  limit: Float!
  billDate: Int!
}

type LoanAccount  {
  _id: ID!
  name: String!
  accountType: AccountType!
  date: Date!
  emiStartDate: Date!
  totalEMIs: Int!
}

extend type User @key(fields: "_id", resolvable: false) {  # 👈 resolvable: false = owned by user-service
  _id: ID! 
}

extend schema
  @link(
    url: "https://specs.apollo.dev/federation/v2.3"
    import: ["@key", "@shareable", "@external"]
  )
